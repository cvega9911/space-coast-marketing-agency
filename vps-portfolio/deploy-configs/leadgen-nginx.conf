# leadgen.presencify.co — Presencify Lead Generation Tool
# Reverse proxies to Flask app on 127.0.0.1:8090
server {
    server_name leadgen.presencify.co;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/leadgen.presencify.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadgen.presencify.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = leadgen.presencify.co) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name leadgen.presencify.co;
    return 404;
}