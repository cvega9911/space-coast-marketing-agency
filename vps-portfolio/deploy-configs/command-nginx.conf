# Nginx reverse proxy for Dojo Command Center
# Domain: command.spacecoastmarketing.co → 127.0.0.1:8897
server {
    server_name command.spacecoastmarketing.co;

    location / {
        proxy_pass http://127.0.0.1:8897;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/command.spacecoastmarketing.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/command.spacecoastmarketing.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = command.spacecoastmarketing.co) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name command.spacecoastmarketing.co;
    return 404;
}