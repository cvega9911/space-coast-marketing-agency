# Nginx reverse proxy for Local Business Health Check
# Domain: health.spacecoastmarketing.co → 127.0.0.1:8891
# Copy to /etc/nginx/sites-available/health.spacecoastmarketing.co
# Then: sudo ln -s /etc/nginx/sites-available/health.spacecoastmarketing.co /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d health.spacecoastmarketing.co
#       sudo chmod 644 /etc/nginx/sites-available/health.spacecoastmarketing.co

server {
    listen 80;
    server_name health.spacecoastmarketing.co;

    location / {
        proxy_pass http://127.0.0.1:8891;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}