# Nginx reverse proxy for Photo-to-Estimate app
# Domain: app.spacecoastmarketing.co → 127.0.0.1:8890
# Copy to /etc/nginx/sites-available/app.spacecoastmarketing.co
# Then: sudo ln -s /etc/nginx/sites-available/app.spacecoastmarketing.co /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d app.spacecoastmarketing.co

server {
    listen 80;
    server_name app.spacecoastmarketing.co;

    # Upload size for photos (10MB)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # Photo upload + analysis can take time
    }
}